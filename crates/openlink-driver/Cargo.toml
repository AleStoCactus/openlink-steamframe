[package]
name = "openlink-driver"
description = "OpenLink SteamVR driver (loaded into vrserver)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "driver_openlink"
crate-type = ["cdylib", "rlib"]

[dependencies]
openlink-protocol.workspace = true
openlink-tracking.workspace = true
glam.workspace = true
log.workspace = true
dirs = "7.0.0"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Security",
    "Win32_System_Threading",
] }
