[workspace]
resolver = "2"
members = [
    "crates/openlink-protocol",
    "crates/openlink-tracking",
    "crates/openlink-driver",
    "crates/openlink-server",
    "crates/openlink-client",
    "crates/openlink-quest",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[workspace.dependencies]
openlink-protocol = { path = "crates/openlink-protocol" }
openlink-tracking = { path = "crates/openlink-tracking" }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", default-features = false, features = ["use-std"] }
glam = { version = "0.29", features = ["serde"] }
thiserror = "2"
log = "0.4"
env_logger = "0.11"

[profile.release]
debug = 1
lto = "thin"
